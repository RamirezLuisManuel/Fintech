version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: prueba_postgres
    environment:
      POSTGRES_USER: manuel
      POSTGRES_PASSWORD: linux123
      POSTGRES_DB: prueba_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: prueba_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
